body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(29,20,48,.35) 0%,rgba(29,20,48,.55) 45%,rgba(29,20,48,.82) 100%)}
h1,h2,.num{font-family:Fraunces,Georgia,serif}
.hero{position:relative;min-height:min(58vh,520px);display:flex;align-items:flex-end;overflow:hidden}
.hero-in{position:relative;padding:clamp(28px,5vw,64px) max(5vw,16px);width:100%;max-width:1240px;margin:0 auto}
h1{text-shadow:0 2px 24px rgba(0,0,0,.45);font-size:clamp(36px,6vw,56px);line-height:1.05;margin:0 0 8px;font-weight:800;text-wrap:balance}
.sub{margin:0;color:var(--ink);opacity:.85;font-size:17px;max-width:38ch}
.pill{display:inline-flex;gap:10px;align-items:center;margin-top:18px;padding:10px 16px;border-radius:999px;background:rgba(29,20,48,.55);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:15px}
.pill b{font-variant-numeric:tabular-nums;color:var(--sun);white-space:nowrap}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px);max-width:1240px;margin:0 auto}.band.cal{max-width:960px}
h2{font-size:28px;margin:0 0 16px;font-weight:600}
.month{margin-bottom:40px}
.cal{max-width:880px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.dow{text-align:center;font-size:13px;color:var(--mute);padding-bottom:2px}
.blank{aspect-ratio:1/1}
.tile{position:relative;aspect-ratio:1/1;border-radius:16px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);font:inherit;cursor:pointer;overflow:hidden;background:rgba(38,27,62,.72);backdrop-filter:blur(4px)}
.tile:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.tile .wd{font-size:13px;color:var(--mute)}
.tile .num{font-size:clamp(20px,4vw,36px);line-height:1;font-weight:600}
.tile>*{position:relative;z-index:1}.tile .st{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;white-space:nowrap}
.tile.locked{cursor:default}
.tile.locked .num{opacity:.45}
.tile.locked::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff5,transparent),radial-gradient(1px 1px at 40% 75%,#fff4,transparent);pointer-events:none}
.tile.open{background:linear-gradient(180deg,#5b3a6e 0%,#c9718a 55%,#ffc99a 100%);border-color:transparent}
.tile.open .wd,.tile.open .st{color:#fff3e8}
.tile.open::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-14px;bottom:-30px;background:radial-gradient(circle,#ffe9a8,#ffd76e 60%,transparent 62%);opacity:.9}
.tile.today{box-shadow:0 0 0 2px var(--sun),0 10px 40px -10px #ffd76e88}
.tile.next{border:1px dashed var(--rose)}
.tile.next .st{color:var(--rose)}
.tile.watched .st::before{content:"✓";font-weight:700}
.note{font-size:13px;color:var(--mute);margin-top:4px}
dialog{border:0;border-radius:22px;padding:0;max-width:min(560px,92vw);width:100%;background:var(--night2);color:var(--ink);box-shadow:0 30px 80px #0009}
dialog::backdrop{background:rgba(10,6,20,.7)}
.dl-top{padding:28px 28px 8px;background:linear-gradient(180deg,#5b3a6e,#2b1d45)}
.dl-top .wd{color:var(--peach);font-size:14px}
.dl-top h3{font-family:Fraunces,serif;font-size:32px;margin:4px 0 0;line-height:1.1}
.dl-body{padding:16px 28px 28px}
.dl-body p{margin:0 0 16px;color:var(--ink);opacity:.9}
.frame{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:16px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;border:0;font:500 16px "DM Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--sun);color:#2b1d45}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 16px 48px}
@media(max-width:700px){.tile .st span{display:none}}@media(max-width:600px){.grid{gap:5px}.tile{padding:6px;border-radius:10px}.tile>*{position:relative;z-index:1}.tile .st{font-size:11px}.dow{font-size:12px}.hero{min-height:52vh}.tile.open::after{width:40px;height:40px;right:-10px;bottom:-18px}}
</style>
</head>

};

// true = play YouTube/Drive videos inside the page (works on GitHub Pages / Netlify).
// false = show a "Watch" button that opens the link. Keep false while viewing on claude.ai.
const EMBED = false;

// For testing only: pretend it's this moment, e.g. "2026-12-10T07:00:00+08:00". Keep null when live.
const TEST_NOW = null;
/* ================================================== */

const UNLOCK_HOUR_SGT = "06:00:00+08:00";             // 6 am Singapore time
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => TEST_NOW ? new Date(TEST_NOW) : new Date();

// build the day list from VIDEOS, each with its exact unlock moment
const days = Object.keys(VIDEOS).sort().map((d, i) => ({
  key: d, i,
  unlock: new Date(`${d}T${UNLOCK_HOUR_SGT}`),
  date: new Date(`${d}T12:00:00+08:00`),               // midday SGT, safe for labels
  enc: VIDEOS[d]
}));
// unscramble one day's link + caption (only called once that day has unlocked)
const decode = d => {
  const b = Uint8Array.from(atob(d.enc), c => c.charCodeAt(0)), k = "sd" + d.key;
  const out = b.map((c, i) => c ^ k.charCodeAt(i % k.length) ^ ((i * 31) & 255));
  return JSON.parse(new TextDecoder().decode(out));
};
const fmt = (d, o) => d.toLocaleDateString("en-GB", { timeZone: "Asia/Singapore", ...o });

// remember which videos were opened (this browser only)
let watched = {};
try { watched = JSON.parse(localStorage.getItem("mornings-watched") || "{}"); } catch (e) {}
const saveWatched = () => { try { localStorage.setItem("mornings-watched", JSON.stringify(watched)); } catch (e) {} };

$("#title").textContent = TITLE;
$("#subtitle").textContent = SUBTITLE;


const countdown = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = n => String(n).padStart(2, "0");
  return (d ? `${d}d ` : "") + `${p(h)}:${p(m)}:${p(sec)}`;
};

function render() {
  const t = now();
  const focusKey = document.activeElement?.dataset?.k;    // keep keyboard focus across re-renders
  const openCount = days.filter(d => t >= d.unlock).length;
  const next = days.find(d => t < d.unlock);
  const latest = openCount ? days[openCount - 1] : null;


  // status pill
  const pill = $("#pill");
  if (!next) pill.innerHTML = `All ${days.length} mornings are open`;
  else if (!openCount) pill.innerHTML = `First morning opens in <b>${countdown(next.unlock - t)}</b>`;
  else pill.innerHTML = `${openCount} of ${days.length} open · next in <b>${countdown(next.unlock - t)}</b>`;

  // tiles grouped by month
  const groups = {};
  days.forEach(d => (groups[fmt(d.date, { month: "long", year: "numeric" })] ||= []).push(d));
  $("#months").innerHTML = Object.entries(groups).map(([month, list]) => `
    <section class="month"><h2>${esc(month)}</h2><div class="grid">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w => `<div class="dow">${w}</div>`).join("")}
      ${'<div class="blank"></div>'.repeat((list[0].date.getUTCDay() + 6) % 7)}
      ${list.map(d => {
        const open = t >= d.unlock, isNext = next && next.key === d.key, isToday = latest && latest.key === d.key;
        const cls = ["tile", open ? "open" : "locked", isNext ? "next" : "", isToday && next ? "today" : "", watched[d.key] ? "watched" : ""].join(" ");
        const st = open ? (watched[d.key] ? "<span>Watched</span>" : (d.enc ? "▶ <span>Watch</span>" : "<span>Coming soon</span>"))
                 : isNext ? `⏳ <span>${countdown(d.unlock - t)}</span>` : "🔒 <span>6:00 am</span>";
        return `<button class="${cls}" data-k="${esc(d.key)}" ${open ? "" : 'aria-disabled="true"'}
                  aria-label="${esc(fmt(d.date, { weekday: "long", day: "numeric", month: "long" }))}${open ? "" : ", locked"}">
          <span class="num">${esc(fmt(d.date, { day: "numeric" }))}</span>
          <span class="st">${st}</span></button>`;
      }).join("")}
    </div></section>`).join("");
  if (focusKey) document.querySelector(`.tile[data-k="${focusKey}"]`)?.focus();
}

// turn a YouTube / Drive link into an embeddable one
function embedUrl(u) {
  let m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?rel=0`;
  m = u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return null;
}

function openDay(key) {
  const d = days.find(x => x.key === key);
  if (!d || now() < d.unlock) return;                 // locked: do nothing
  const { url, note } = d.enc ? decode(d) : { url: "", note: "" };
  $("#dlWd").textContent = fmt(d.date, { weekday: "long" }) + ` · morning ${d.i + 1} of ${days.length}`;
  $("#dlTitle").textContent = fmt(d.date, { day: "numeric", month: "long" });
  const body = $("#dlBody");
  if (!url) {
    body.innerHTML = `<p>This one isn't uploaded yet. Check back a little later.</p>
      <div class="row"><button class="btn sec" data-close>Close</button></div>`;
  } else {
    const e = EMBED && embedUrl(url);
    body.innerHTML = (e ? `<div class="frame"><iframe src="${esc(e)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>` : "")
      + (note ? `<p>${esc(note)}</p>` : "")
      + `<div class="row"><a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">${e ? "Open in new tab" : "▶ Watch"}</a>
         <button class="btn sec" data-close>Close</button></div>`;
    watched[d.key] = true; saveWatched();
  }
  $("#dlg").showModal();
}

$("#months").addEventListener("click", e => {
  const b = e.target.closest(".tile");
  if (b) openDay(b.dataset.k);
});
$("#dlg").addEventListener("click", e => {
  if (e.target.matches("[data-close]") || e.target === $("#dlg")) $("#dlg").close();
});
$("#dlg").addEventListener("close", () => { $("#dlBody").innerHTML = ""; render(); }); // stops video playback

render();
setInterval(render, 1000);                             // tick countdowns; unlocks happen live at 6 am
}
</script>
